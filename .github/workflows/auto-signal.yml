name: JAGUNMOLU FX Auto Signal

on:
  schedule:
    # Run every 5 minutes, offset from the top of the hour
    - cron: "1-59/5 * * * *"
  workflow_dispatch:

# Prevent overlapping signal scans
concurrency:
  group: jagunmolu-auto-signal
  cancel-in-progress: false

jobs:
  auto-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Trigger JAGUNMOLU FX signal engine
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting JAGUNMOLU signal scan at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          curl --fail --silent --show-error \
            --request POST \
            --connect-timeout 15 \
            --max-time 60 \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            "https://jagunmolu-fx-ai-signal-bot.floot.app/_api/ai/scan"

          echo
          echo "JAGUNMOLU signal scan completed at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
