name: JAGUNMOLU FX Auto Signal

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  auto-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger JAGUNMOLU FX signal engine
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --connect-timeout 15 \
            --max-time 60 \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            "https://jagunmolu-fx-ai-signal-bot.floot.app/_api/ai/scan"
